name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Firebase config from secrets
        env:
          FIREBASE_API_KEY:             ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN:         ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID:          ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET:      ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID:              ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID:      ${{ secrets.FIREBASE_MEASUREMENT_ID }}
        run: |
          {
            echo "// Firebase Config - auto-generated by GitHub Actions"
            echo "// Keys stored in GitHub Secrets, never committed to repo"
            echo "const firebaseConfig = {"
            echo "  apiKey:            \"$FIREBASE_API_KEY\","
            echo "  authDomain:        \"$FIREBASE_AUTH_DOMAIN\","
            echo "  projectId:         \"$FIREBASE_PROJECT_ID\","
            echo "  storageBucket:     \"$FIREBASE_STORAGE_BUCKET\","
            echo "  messagingSenderId: \"$FIREBASE_MESSAGING_SENDER_ID\","
            echo "  appId:             \"$FIREBASE_APP_ID\","
            echo "  measurementId:     \"$FIREBASE_MEASUREMENT_ID\""
            echo "};"
            echo ""
            echo "firebase.initializeApp(firebaseConfig);"
            echo ""
            echo "const db   = firebase.firestore();"
            echo "const auth = firebase.auth();"
          } > firebase-config.js
          echo "firebase-config.js generated successfully"
          cat firebase-config.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
