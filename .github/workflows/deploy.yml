name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Generate firebase-config.js from GitHub Secrets ──────────────────
      - name: Generate Firebase config
        env:
          FIREBASE_API_KEY:             ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN:         ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID:          ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET:      ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID:              ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID:      ${{ secrets.FIREBASE_MEASUREMENT_ID }}
        run: |
          python3 - <<'PYEOF'
          import os
          content = """// Firebase Config — auto-generated by GitHub Actions
// Keys are stored in GitHub Secrets, never committed to the repository.
const firebaseConfig = {{
  apiKey:            "{api_key}",
  authDomain:        "{auth_domain}",
  projectId:         "{project_id}",
  storageBucket:     "{storage_bucket}",
  messagingSenderId: "{sender_id}",
  appId:             "{app_id}",
  measurementId:     "{measurement_id}"
}};

firebase.initializeApp(firebaseConfig);

const db   = firebase.firestore();
const auth = firebase.auth();
""".format(
            api_key          = os.environ['FIREBASE_API_KEY'],
            auth_domain      = os.environ['FIREBASE_AUTH_DOMAIN'],
            project_id       = os.environ['FIREBASE_PROJECT_ID'],
            storage_bucket   = os.environ['FIREBASE_STORAGE_BUCKET'],
            sender_id        = os.environ['FIREBASE_MESSAGING_SENDER_ID'],
            app_id           = os.environ['FIREBASE_APP_ID'],
            measurement_id   = os.environ['FIREBASE_MEASUREMENT_ID'],
          )
          with open('firebase-config.js', 'w') as f:
              f.write(content)
          print("firebase-config.js generated successfully")
          PYEOF

      # ── Deploy ────────────────────────────────────────────────────────────
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
